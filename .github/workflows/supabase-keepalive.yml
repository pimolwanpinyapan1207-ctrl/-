# Supabase pauses free projects after 7 days without activity, which takes the tracker offline.
# This makes one small read request every day so the project counts as in use.
# It uses the public anon key (the same one the web page uses); row-level security still hides the data.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1 * * *"   # every day 01:17 UTC (08:17 Thailand)
  workflow_dispatch: {}      # also runnable by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          SUPABASE_URL: https://urqkmzqtmvwkmezadnke.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVycWttenF0bXZ3a21lemFkbmtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3OTMwMTMsImV4cCI6MjEwNzM2OTAxM30.AWyx6WE6_uA_z6XLpbz-sxSltdbBMnFiUykXLkbCU4w
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/docsets?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $code"
          # fail loudly (GitHub e-mails the repo owner) if the project is already paused or unreachable
          test "$code" = "200"
